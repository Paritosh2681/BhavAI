services:
  # ── Backend API + MCP endpoint ──────────────────────────────
  - type: web
    name: bhavai-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w @bhavai/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: MCP_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: LOG_LEVEL
        value: info

  # ── Frontend (static site) ──────────────────────────────────
  - type: web
    name: bhavai-web
    runtime: static
    buildCommand: npm ci && npm run build -w @bhavai/web
    staticPublishPath: apps/web/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /api/*
        destination: https://bhavai-api-k5vd.onrender.com/api/*
      - type: rewrite
        source: /mcp
        destination: https://bhavai-api-k5vd.onrender.com/mcp
      - type: rewrite
        source: /mcp/*
        destination: https://bhavai-api-k5vd.onrender.com/mcp/*
      - type: rewrite
        source: /health
        destination: https://bhavai-api-k5vd.onrender.com/health
      - type: rewrite
        source: /*
        destination: /index.html

